<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Dimple Khinchi — Makeup Artist &amp; Beauty Creator | Ajmer &amp; Jaipur</title>
    <meta name="title" content="Dimple Khinchi — Makeup Artist &amp; Beauty Creator | Ajmer &amp; Jaipur" />

    <meta name="theme-color" content="#121110" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dimple Khinchi — Makeup Artist &amp; Beauty Creator" />
    <meta property="og:description" content="Your Look. Your Moment. Bespoke makeup artistry by Dimple Khinchi, Ajmer &amp; Jaipur." />

    <meta property="twitter:description" content="Your Look. Your Moment. Bespoke makeup artistry by Dimple Khinchi." />

    <!-- Preconnect Origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload Critical LCP Hero Image Asset -->
    <link
      rel="preload"
      as="image"
      href="/images/portfolio/bridal-regal-portrait-480.webp"
      imagesrcset="/images/portfolio/bridal-regal-portrait-480.webp 480w, /images/portfolio/bridal-regal-portrait-768.webp 768w, /images/portfolio/bridal-regal-portrait-1200.webp 1200w"
      imagesizes="(max-width: 640px) 92vw, (max-width: 1024px) 45vw, 520px"
      fetchpriority="high"
      type="image/webp"
    />

    <!-- Preload Header Brand Emblem -->
    <link
      rel="preload"
      as="image"
      href="/images/branding/logo-96.webp"
      type="image/webp"
    />

    <!-- Non-Blocking Google Fonts Loading with Swap Fallback -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"

      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"

  <body class="bg-[#121110] text-[#F6F2EC] font-sans antialiased selection:bg-[#7A2837] selection:text-white">
